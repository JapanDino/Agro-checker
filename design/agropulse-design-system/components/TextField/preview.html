<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root" class="ap-root"></div>
<script>
  var A = window.AgroPulse, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(200px,1fr))', gap:12, padding:16}},
    h(A.TextField, {label:'Дата расчёта', type:'date', defaultValue:'2024-05-20'}),
    h(A.TextField, {label:'Культура', options:[{value:'w',label:'Озимая пшеница'},{value:'b',label:'Озимый ячмень'},{value:'c',label:'Кукуруза'}]}),
    h(A.TextField, {label:'Обработка', placeholder:'Препарат и норма', hint:'Защита считается 14 дней'}),
    h(A.TextField, {label:'Дата сева', defaultValue:'31.02.2023', error:'Такой даты нет — проверьте строку 14 в выгрузке'})));
</script>
</body>
</html>
