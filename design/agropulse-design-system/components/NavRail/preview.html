<html lang="ru">
<head><meta charset="utf-8"><title>NavRail — preview</title></head>
<body>
<div id="root" class="ap-root"></div>

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'flex', gap:24, alignItems:'flex-start', padding:16, flexWrap:'wrap'}},

    h('div', {style:{flex:'1 1 320px', maxWidth:420, background:'var(--paper)', borderRadius:16, boxShadow:'var(--shadow)'}},
      h(A.NavRail, {horizontal:true, defaultActive:'map', items:[{id:'map',label:'Карта'},{id:'today',label:'Сегодня',badge:2},{id:'trips',label:'Выезды'},{id:'history',label:'История'}]}))));
</script>
</body>
</html>
