<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>SummaryTile — preview</title></head>
<body>
<div id="root" class="ap-root"></div>
<script>
  var A = window.AgroPulse, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'ap-tiles', style:{padding:16}},
    h(A.SummaryTile, {status:'risk', label:'Риск', value:2, hint:'осмотреть за 1–2 дня'}),
    h(A.SummaryTile, {status:'check', label:'Проверить', value:2, hint:'при объезде'}),
    h(A.SummaryTile, {status:'normal', label:'Норма', value:22}),
    h(A.SummaryTile, {label:'Нет правил', value:1, hint:'кукуруза'})));
</script>
</body>
</html>
